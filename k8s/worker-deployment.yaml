apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker-deployment
  labels:
    app: worker
  namespace: keda-rabbitmq-autoscaling

spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      namespace: keda-rabbitmq-autoscaling
    spec:
      containers:
      - name: worker
        image: rabbitmq-worker:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
          - name: RABBITMQ_USERNAME
            valueFrom:
              secretKeyRef:
                name: rabbitmq-credentials
                key: username
          - name: RABBITMQ_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rabbitmq-credentials
                key: password
          - name: RABBITMQ_HOST
            value: rabbitmq
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
